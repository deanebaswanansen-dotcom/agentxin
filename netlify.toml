[build]
  base = "frontend"
  command = "npm --prefix ../backend install && npm --prefix ../backend run build && npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . ../backend ../netlify.toml"

[build.environment]
  VITE_AGENT_BACKGROUND_JOBS = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
