[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-agent"
version = "0.1.0"
description = "LangChain/LangGraph-ready novel writing agent"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
]

[project.scripts]
novel-agent = "novel_agent.cli:main"

[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
testpaths = ["tests"]
markers = [
  "integration: real provider/API tests; skipped by default unless explicitly selected",
]

[tool.setuptools.packages.find]
where = ["src"]
